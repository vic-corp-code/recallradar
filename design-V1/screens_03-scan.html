<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RecallRadar · Scan</title>
  <style>
    :root {
      --bg:      #1a1815;
      --surface: #2a2622;
      --fg:      #f0ece5;
      --muted:   #8a8278;
      --border:  #3a3530;
      --accent:  #c47a4a;
      --accent-soft: rgba(196, 122, 74, 0.15);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Söhne', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    .screen { display: flex; flex-direction: column; height: 100%; }

    .statusbar {
      flex: 0 0 47px;
      padding: 18px 26px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      font-size: 15px; font-weight: 600; color: var(--fg); letter-spacing: -0.01em;
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: var(--fg); }
    .statusbar .battery { width: 25px; }

    .content { flex: 1; position: relative; overflow: hidden; }

    .viewfinder {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 80%),
        var(--bg);
      display: grid;
      place-items: center;
    }

    .receipt-guide {
      width: 260px;
      height: 380px;
      border: 2px dashed rgba(196, 122, 74, 0.5);
      border-radius: 12px;
      position: relative;
    }
    .receipt-guide::before {
      content: '';
      position: absolute;
      top: -8px; left: 50%; transform: translateX(-50%);
      width: 40px; height: 3px;
      background: var(--accent);
      border-radius: 2px;
    }
    .receipt-guide::after {
      content: '';
      position: absolute;
      bottom: -8px; left: 50%; transform: translateX(-50%);
      width: 40px; height: 3px;
      background: var(--accent);
      border-radius: 2px;
    }

    .corner {
      position: absolute;
      width: 20px; height: 20px;
    }
    .corner svg { width: 20px; height: 20px; }
    .corner.tl { top: -2px; left: -2px; }
    .corner.tr { top: -2px; right: -2px; transform: scaleX(-1); }
    .corner.bl { bottom: -2px; left: -2px; transform: scaleY(-1); }
    .corner.br { bottom: -2px; right: -2px; transform: scale(-1); }

    .guide-label {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .controls {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      padding: 24px 20px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 5;
    }

    .shutter {
      width: 68px; height: 68px;
      border-radius: 50%;
      background: var(--fg);
      border: 4px solid var(--border);
      cursor: pointer;
      position: relative;
    }
    .shutter::after {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: var(--fg);
      border: 2px solid var(--bg);
    }

    .alt-actions {
      display: flex;
      gap: 24px;
    }
    .alt-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-size: 11px;
      background: none;
      border: none;
      cursor: pointer;
    }
    .alt-btn .icon-wrap {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      display: grid;
      place-items: center;
    }
    .alt-btn svg { width: 20px; height: 20px; stroke: var(--fg); fill: none; stroke-width: 1.7; }

    .close-btn {
      position: absolute;
      top: 52px; left: 20px;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      display: grid; place-items: center;
      z-index: 10;
      cursor: pointer;
    }
    .close-btn svg { width: 18px; height: 18px; stroke: var(--fg); fill: none; stroke-width: 2; }

    .home-indicator { flex: 0 0 28px; position: relative; z-index: 10; }
    .home-indicator::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 8px;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: var(--fg);
      border-radius: 999px;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="statusbar">
      <span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-variant-numeric: tabular-nums;">9:41</span>
      <span class="right">
        <svg viewBox="0 0 17 11" aria-hidden><rect x="0" y="7" width="3" height="4" rx="0.6"/><rect x="4" y="5" width="3" height="6" rx="0.6"/><rect x="8" y="3" width="3" height="8" rx="0.6"/><rect x="12" y="0" width="3" height="11" rx="0.6"/></svg>
        <svg viewBox="0 0 17 11" aria-hidden><path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/></svg>
        <svg class="battery" viewBox="0 0 25 11" aria-hidden><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/><rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg>
      </span>
    </div>

    <button class="close-btn" aria-label="Fermer">
      <svg viewBox="0 0 24 24" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>

    <main class="content" data-od-id="content">
      <div class="viewfinder" data-od-id="viewfinder">
        <div class="receipt-guide">
          <span class="guide-label">Cadrez le ticket de caisse</span>
        </div>
      </div>
    </main>

    <div class="controls" data-od-id="controls">
      <div class="shutter" data-od-id="shutter"></div>
      <div class="alt-actions">
        <button class="alt-btn">
          <div class="icon-wrap">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </div>
          Galerie
        </button>
        <button class="alt-btn">
          <div class="icon-wrap">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          </div>
          Importer
        </button>
      </div>
    </div>

    <div class="home-indicator" aria-hidden></div>
  </div>
</body>
</html>
